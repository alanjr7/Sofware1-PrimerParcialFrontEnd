<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Sala - Sistema de Diagramas UML</title>
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/agentGuide.css">
    <script src="./js/config.js"></script>
    <script src="./js/authGuard.js"></script>
</head>
<body>
    <!-- Modular Top Navbar -->
    <nav id="navbar">
        <div class="nav-container">
            <a href="dashboard.html" class="nav-brand-group">
                <div class="brand-icon-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="3" y1="9" x2="21" y2="9"></line>
                        <line x1="9" y1="21" x2="9" y2="9"></line>
                    </svg>
                </div>
                <div class="nav-brand-text">
                    <span class="nav-brand-title">UML Studio</span>
                    <span class="nav-brand-badge">Enterprise Console</span>
                </div>
            </a>
            
            <ul class="nav-links">
                <li>
                    <a href="dashboard.html" class="nav-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                            <polyline points="9 22 9 12 15 12 15 22"></polyline>
                        </svg>
                        <span>Inicio</span>
                    </a>
                </li>
                <li>
                    <a href="crearSala.html" class="nav-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        <span>Nueva Sala</span>
                    </a>
                </li>
                <li class="nav-divider"></li>
                <li>
                    <button id="logout-button" title="Cerrar Sesión Segura">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                        <span>Cerrar Sesión</span>
                    </button>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Contenido Principal: Formulario de Edición -->
    <main id="main-content">
        <div class="form-page-container">
            <div class="form-card">
                <header class="form-header">
                    <nav class="form-breadcrumb">
                        <a href="dashboard.html">Dashboard</a>
                        <span>/</span>
                        <span>Espacios de Trabajo</span>
                        <span>/</span>
                        <span id="breadcrumb-room-id">Editar Sala</span>
                    </nav>
                    <h1>Actualizar Parámetros de la Sala</h1>
                    <p>Modifica el título, esquema estructural o descripción técnica del espacio colaborativo.</p>
                </header>

                <form id="edit-room-form">
                    <input type="hidden" id="room-id" />

                    <div class="form-group">
                        <label for="title" class="form-label">
                            <span>Título del Proyecto / Sala *</span>
                            <span class="form-label-hint">Nombre representativo</span>
                        </label>
                        <input 
                            type="text" 
                            id="title" 
                            name="title" 
                            class="form-control" 
                            required 
                        />
                    </div>

                    <div class="form-group">
                        <label for="xml" class="form-label">
                            <span>Definición Estructural (XML) *</span>
                            <span class="form-label-hint">Especificación del modelo</span>
                        </label>
                        <textarea 
                            id="xml" 
                            name="xml" 
                            rows="7" 
                            class="form-control form-control-code" 
                            required
                        ></textarea>
                    </div>

                    <div class="form-group">
                        <label for="description" class="form-label">
                            <span>Descripción Técnica / Notas *</span>
                            <span class="form-label-hint">Documentación técnica</span>
                        </label>
                        <textarea 
                            id="description" 
                            name="description" 
                            rows="4" 
                            class="form-control" 
                            required
                        ></textarea>
                    </div>

                    <div class="form-actions">
                        <a href="dashboard.html" class="btn btn-secondary">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                            Volver al Dashboard
                        </a>
                        <button type="submit" class="btn create-button">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                            Guardar Cambios
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>    

    <video id="video" src="/video.mp4" style="display:none;" controls></video>
    <script src="./js/config.js"></script> 

    <script>
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        async function loadRoomData() {
            const roomId = getQueryParam('id');
            if (roomId) {
                const breadcrumbSpan = document.getElementById('breadcrumb-room-id');
                if (breadcrumbSpan) breadcrumbSpan.textContent = `Sala #${roomId}`;

                try {
                    const response = await fetch(`${API_URL}/apis/sala/${roomId}`, {
                        method: 'GET',
                        credentials: 'include',
                        headers: {
                            'Content-Type': 'application/json',
                        }
                    });
                    const data = await response.json();
                    if (data.error === false && data.data.length > 0) {
                        const room = data.data[0];
                        document.getElementById('room-id').value = room.id;
                        document.getElementById('title').value = room.title || '';
                        document.getElementById('xml').value = room.xml || '';
                        document.getElementById('description').value = room.description || '';
                    } else {
                        alert('No se pudo cargar la información de la sala.');
                    }
                } catch (error) {
                    alert(`Error de red al consultar la sala: ${error.message}`);
                }
            } else {
                alert('No se especificó un ID de sala válido.');
                window.location.href = './dashboard.html';
            }
        }

        async function handleEditRoom(event) {
            event.preventDefault();
            const id = document.getElementById('room-id').value;
            const title = document.getElementById('title').value;
            const xml = document.getElementById('xml').value;
            const description = document.getElementById('description').value;

            try {
                const response = await fetch(`${API_URL}/apis/sala/${id}`, {
                    method: 'PUT',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        title: title.trim(),
                        xml: xml.trim(),
                        description: description.trim(),
                    }),
                });

                if (response.ok) {
                    alert(`Sala #${id} actualizada exitosamente.`);
                    window.location.href = './dashboard.html';
                } else {
                    const errorData = await response.json().catch(() => ({}));
                    alert(`Error al actualizar la sala: ${errorData.message || response.statusText}`);
                }
            } catch (error) {
                alert(`Error de red: ${error.message}`);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadRoomData();
            document.getElementById('edit-room-form').addEventListener('submit', handleEditRoom);

            const logoutBtn = document.getElementById('logout-button');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', function (e) { 
                    e.preventDefault();
                    if (typeof window.logoutUser === 'function') {
                        window.logoutUser();
                    } else {
                        window.location.replace('./login.html');
                    }
                });
            }
        });
    </script>
    <script src="./js/tourCatalog.js"></script>
    <script src="./js/agentGuide.js"></script>
</body>
</html>
