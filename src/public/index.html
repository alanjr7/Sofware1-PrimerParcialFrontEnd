<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario - Sistema de Diagramas UML Colaborativos</title>
    <link rel="stylesheet" href="./css/login.css">
    <link rel="stylesheet" href="./css/agentGuide.css">
</head>
<body>
    <main class="login-container">
        <!-- Columna Izquierda: Formulario de Registro -->
        <section class="login-left">
            <div class="login-card">
                <header class="brand-header">
                    <div class="brand-badge">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="8.5" cy="7" r="4"></circle>
                            <line x1="20" y1="8" x2="20" y2="14"></line>
                            <line x1="23" y1="11" x2="17" y2="11"></line>
                        </svg>
                        <span>Nuevo Registro</span>
                    </div>
                    <h1>Crear Cuenta</h1>
                    <p class="login-subtitle">Regístrate para colaborar en salas de modelado UML en tiempo real</p>
                </header>

                <!-- Mensaje de alerta visual -->
                <div id="alert-container" class="alert alert-danger" role="alert">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <span id="alert-message">Error en el registro</span>
                </div>

                <form id="registration-form" novalidate>
                    <div class="form-group">
                        <label for="name" class="form-label">Nombre Completo</label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="12" cy="7" r="4"></circle>
                                </svg>
                            </span>
                            <input 
                                type="text" 
                                id="name" 
                                name="name" 
                                class="form-control" 
                                placeholder="Tu nombre y apellido" 
                                required 
                                autocomplete="name"
                            >
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email" class="form-label">Correo Electrónico</label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                    <polyline points="22,6 12,13 2,6"></polyline>
                                </svg>
                            </span>
                            <input 
                                type="email" 
                                id="email" 
                                name="email" 
                                class="form-control" 
                                placeholder="ejemplo@correo.com" 
                                required 
                                autocomplete="email"
                            >
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">Contraseña</label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                </svg>
                            </span>
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                class="form-control" 
                                placeholder="Mínimo 6 caracteres" 
                                required 
                                autocomplete="new-password"
                            >
                            <button type="button" id="toggle-password" class="toggle-password" title="Mostrar contraseña" aria-label="Mostrar contraseña">
                                <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" id="btn-register" class="btn-submit">
                        <span id="btn-text">Crear Cuenta</span>
                    </button>
                </form>

                <footer class="login-footer">
                    <p>¿Ya tienes una cuenta? <a href="/login.html">Iniciar sesión aquí</a></p>
                </footer>
            </div>
        </section>

        <!-- Columna Derecha: Título del Proyecto e Ilustración animada -->
        <aside class="login-right">
            <div class="right-content">
                <header class="project-header">
                    <h2 class="project-title">Sistema de Diagramas <span>UML Colaborativos</span></h2>
                </header>
                <div class="illustration-container">
                    <img src="./images/Live%20chatbot.svg" alt="Ilustración animada del sistema" class="animated-illustration">
                </div>
            </div>
        </aside>
    </main>

    <script src="./js/config.js"></script> 
    <script src="./js/register.js"></script>
    <script src="./js/tourCatalog.js"></script>
    <script src="./js/agentGuide.js"></script>
</body>
</html>
