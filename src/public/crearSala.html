<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Nueva Sala - Sistema de Diagramas UML</title>
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/agentGuide.css">
    <script src="./js/config.js"></script>
    <script src="./js/authGuard.js"></script>
</head>
<body>
    <!-- Modular Top Navbar -->
    <nav id="navbar">
        <div class="nav-container">
            <a href="dashboard.html" class="nav-brand-group">
                <div class="brand-icon-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="3" y1="9" x2="21" y2="9"></line>
                        <line x1="9" y1="21" x2="9" y2="9"></line>
                    </svg>
                </div>
                <div class="nav-brand-text">
                    <span class="nav-brand-title">UML Studio</span>
                    <span class="nav-brand-badge">Enterprise Console</span>
                </div>
            </a>
            
            <ul class="nav-links">
                <li>
                    <a href="dashboard.html" class="nav-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                            <polyline points="9 22 9 12 15 12 15 22"></polyline>
                        </svg>
                        <span>Inicio</span>
                    </a>
                </li>
                <li>
                    <a href="crearSala.html" class="nav-link active">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        <span>Nueva Sala</span>
                    </a>
                </li>
                <li class="nav-divider"></li>
                <li>
                    <button id="logout-button" title="Cerrar Sesión Segura">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                        <span>Cerrar Sesión</span>
                    </button>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Contenido Principal: Formulario Modular -->
    <main id="main-content">
        <div class="form-page-container">
            <div class="form-card">
                <header class="form-header">
                    <nav class="form-breadcrumb">
                        <a href="dashboard.html">Dashboard</a>
                        <span>/</span>
                        <span>Espacios de Trabajo</span>
                        <span>/</span>
                        <span>Nueva Sala</span>
                    </nav>
                    <h1>Crear Sala de Modelado UML</h1>
                    <p>Configura los parámetros iniciales y la estructura técnica para tu nuevo proyecto colaborativo.</p>
                </header>

                <form id="create-room-form">
                    <div class="form-group">
                        <label for="title" class="form-label">
                            <span>Título del Proyecto / Sala *</span>
                            <span class="form-label-hint">Identificador descriptivo</span>
                        </label>
                        <input 
                            type="text" 
                            id="title" 
                            name="title" 
                            class="form-control" 
                            placeholder="Ej. Arquitectura Sistema Bancario - Módulo Pagos" 
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="xml" class="form-label">
                            <span>Definición Estructural (XML) *</span>
                            <span class="form-label-hint">Especificación del diagrama</span>
                        </label>
                        <textarea 
                            id="xml" 
                            name="xml" 
                            rows="6" 
                            class="form-control form-control-code" 
                            placeholder="<diagram><class name=&quot;Usuario&quot;></class></diagram>"
                            required
                        ><diagram></diagram></textarea>
                    </div>

                    <div class="form-group">
                        <label for="description" class="form-label">
                            <span>Descripción Técnica / Alcance *</span>
                            <span class="form-label-hint">Objetivo de la sesión</span>
                        </label>
                        <textarea 
                            id="description" 
                            name="description" 
                            rows="4" 
                            class="form-control" 
                            placeholder="Describe el propósito del modelado, reglas de negocio o requisitos clave para los colaboradores..."
                            required
                        ></textarea>
                    </div>

                    <div class="form-actions">
                        <a href="dashboard.html" class="btn btn-secondary">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                            Volver al Dashboard
                        </a>
                        <button type="submit" class="btn create-button">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
                            Crear Sala y Desplegar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <video id="video" src="/video.mp4" style="display:none;" controls></video>

    <script src="./js/config.js"></script>
    <script src="./js/crearSala.js"></script>
    <script src="./js/tourCatalog.js"></script>
    <script src="./js/agentGuide.js"></script>
</body>
</html>
